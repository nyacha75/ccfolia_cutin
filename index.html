<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🌊 [쏘랑] 다인 컷인 에디터</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Nanum+Myeongjo:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #fff; color: #333; padding: 20px; display: flex; flex-direction: column; align-items: center; margin: 0; min-height: 100vh; overflow-x: hidden; }
        .container { display: flex; gap: 15px; width: 100%; justify-content: center; align-items: flex-start; }
        
        .canvas-wrapper { display: flex; flex-direction: column; width: fit-content; max-width: 100%; }
        canvas { border: 2px solid #0055FF; border-radius: 4px; background: #fff; background-image: linear-gradient(45deg, #f0f0f0 25%, transparent 25%), linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f0f0f0 75%), linear-gradient(-45deg, transparent 75%, #f0f0f0 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; }
        .hint-box { font-size: 12px; color: #555; line-height: 1.6; margin-top: 10px; background: #FCFAF7; padding: 15px; border-radius: 4px; border: 1px solid #E8D8C8; box-sizing: border-box; }
        .hint-box span { color: #0055FF; font-weight: bold; }
        
        .control-panel { width: 440px; display: flex; flex-direction: column; gap: 15px; position: sticky; top: 20px; background: #FCFAF7; padding: 20px; border-radius: 8px; border: 2px solid #E8D8C8; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-height: 90vh; overflow-y: auto; flex-shrink: 0; }
        .control-group { border-bottom: 1px solid #E8D8C8; padding-bottom: 15px; }
        .control-group:last-child { border-bottom: none; padding-bottom: 0; }
        .control-group h3 { margin: 0 0 10px 0; font-size: 15px; color: #0055FF; }
        
        input, select { background: #fff; border: 1px solid #E8D8C8; padding: 7px; border-radius: 4px; box-sizing: border-box; color: #333; font-size: 12px; outline: none; }
        input:focus, select:focus { border-color: #0055FF; }
        input[type="checkbox"] { cursor: pointer; vertical-align: middle; margin: 0; }
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; text-align: center; }

        .color-combo { display: flex; align-items: center; border: 1px solid #ccc; border-radius: 3px; background: #fff; height: 22px; width: fit-content; overflow: hidden; transition: 0.2s; }
        .color-combo input[type="color"] { width: 22px; height: 22px; border: none; padding: 0; margin: 0; cursor: pointer; background: transparent; }
        .color-combo input[type="text"] { width: 55px; border: none; font-size: 11px; text-transform: uppercase; font-family: monospace; text-align: center; outline: none; padding: 0; }
        
        .row { display: flex; gap: 5px; margin-bottom: 5px; align-items: center; }
        .btn { background: #fff; color: #333; border: 1px solid #E8D8C8; flex: 1; padding: 8px 6px; font-size: 12px; cursor: pointer; border-radius: 4px; transition: 0.2s; text-align: center; }
        .btn:hover { background: #F2E8DA; }
        .btn.hl { background: #F2E8DA; font-weight: bold; }
        .btn.hl:hover { background: #E8D8C8; }
        .btn.magic { background: #0055FF; color: #fff; border-color: #0044CC; font-weight: bold; font-size: 13px; padding: 10px; }
        .btn.magic:hover { background: #0044CC; }
        
        .layer-list { max-height: 220px; overflow-y: auto; background: #fff; border: 1px solid #E8D8C8; border-radius: 4px; padding: 5px; }
        .layer-item { background: #FCFAF7; margin-bottom: 5px; padding: 10px; border-radius: 4px; border: 1px solid #E8D8C8; cursor: grab; }
        .layer-item.active { border-color: #0055FF; background: #F0F4FF; }
        .layer-item.drag-over { border: 2px dashed #0055FF; opacity: 0.8; }
        .thumb { width: 30px; height: 30px; object-fit: contain; background: #fff; border-radius: 4px; border: 1px solid #E8D8C8; flex-shrink: 0; }
        .l-btn { background: #F2E8DA; border: 1px solid #E8D8C8; padding: 3px 6px; font-size: 10px; border-radius: 4px; cursor: pointer; }
        .l-btn.del { background: #ff4d4d; color: #fff; border: none; font-size: 11px; }
        .char-color-box { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .char-color-box span { font-size: 11px; font-weight: bold; color: #555; }
        .fx-label { display: flex; align-items: center; gap: 3px; white-space: nowrap; cursor: pointer; font-size: 11px; }

        .action-btn { border: none; padding: 14px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 14px; color: #fff; }
        #previewBtn { background: #E8D8C8; color: #333; border: 1px solid #DBC4AC; } 
        #generateBtn { background: #0055FF; }
        button:disabled { background: #ccc !important; cursor: not-allowed; color: #888 !important; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f0f0f0; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    </style>
</head>
<body>
    <div style="visibility: hidden; position: absolute; font-family: 'Black Han Sans';">.</div>
    <div style="visibility: hidden; position: absolute; font-family: 'Jua';">.</div>
    <div style="visibility: hidden; position: absolute; font-family: 'Nanum Myeongjo';">.</div>

    <div id="mainHeader" style="width: 1055px; max-width: 100%; margin-bottom: 20px; transition: width 0.2s ease; text-align: center;">
        <h2 style="margin: 0 auto; background: #0055FF; color: #fff; font-family: 'Black Han Sans', sans-serif; font-weight: 400; padding: 10px 40px; border-radius: 4px; display: inline-block; font-size: 26px; letter-spacing: 1px;">🌊 [쏘랑] 다인 컷인 에디터</h2>
    </div>

    <div class="container">
        <div class="canvas-wrapper">
            <canvas id="canvas" width="600" height="800"></canvas>
            <div class="hint-box">
                • <span>마우스 드래그</span>: 이동 (텍스트/이미지 이동) | <span>휠</span>: 크기 조절<br>
                • <span>[간단 배치]</span>: 이미지 비율(가로/세로형)을 자동 판별하여 최적의 배열로 정렬합니다.
            </div>
            
            <div style="background:#F0F4FF; border:1px solid #0055FF; padding:15px; border-radius:6px; margin-top:10px;">
                <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;">
                    <h3 style="margin:0; font-size:14px; color:#0044CC;">💾 작업 데이터 백업 및 복원</h3>
                    <span id="autoSaveStatus" style="font-size:12px; color:#ff4d4d; font-weight:bold;"></span>
                </div>
                <div class="row">
                    <button class="btn" style="border-color:#0055FF; color:#0055FF; font-weight:bold; padding:10px;" onclick="saveProjectFile()">↓ 프로젝트 저장 (.json)</button>
                    <button class="btn" style="border-color:#0055FF; color:#0055FF; font-weight:bold; padding:10px;" onclick="$('projectFileInput').click()">↑ 프로젝트 불러오기</button>
                    <input type="file" id="projectFileInput" accept=".json" style="display:none;" onchange="loadProjectFile(event)">
                </div>
                <div style="font-size:12px; color:#555; margin-top:10px; line-height:1.5;">
                    • 작업 내용은 브라우저 내부에 <b>실시간 자동 보존</b>됩니다.<br>
                    • 브라우저 캐시 초기화 시 데이터가 삭제될 수 있으므로 중요 작업은 <b>프로젝트 파일로 저장</b>하세요.
                </div>
            </div>
        </div>
        
        <div class="control-panel">
            <div class="control-group">
                <h3>1. 이미지</h3>
                <div class="row">
                    <label style="font-size:12px; width:80px;">파일 업로드:</label>
                    <input type="file" id="imageInput" multiple accept="image/*" style="flex:1;">
                </div>
            </div>
            
            <div class="control-group">
                <h3>2. 캔버스 조절 및 이미지 정렬</h3>
                <div class="row">
                    <button class="btn magic" onclick="act('quick')">✨ 간단 배치 (자동 정렬)</button>
                </div>
                
                <div style="text-align:center; margin: 8px 0 3px 0;">
                    <span onclick="toggleAdvAlign(this)" style="text-decoration: underline; cursor: pointer; font-size: 11px; color: #555;">상세 조절 펼치기 ▼</span>
                </div>
                
                <div id="advAlignWrapper" style="display:none; margin-top:8px;">
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;">
                        <button class="btn hl" onclick="act('matchH')">📏 세로 통일</button>
                        <button class="btn hl" onclick="act('matchW')">📏 가로 통일</button>
                        <button class="btn hl" onclick="act('crop')">✂️ 캔버스 맞추기</button>
                        <button class="btn" onclick="act('distH')">↔️ 가로 간격 정렬</button>
                        <button class="btn" onclick="act('distV')">↕️ 세로 간격 정렬</button>
                        <div style="display:flex; justify-content:center; align-items:center; background:#fff; border:1px solid #E8D8C8; border-radius:4px; height: 32px;">
                            <label style="font-size:12px; display:flex; align-items:center; margin:0; cursor:pointer; white-space:nowrap;">이미지 간격: 
                                <input type="number" id="gap" value="20" onchange="triggerAutoSave()" style="width:35px; margin-left:4px; height:20px; border:1px solid #ccc; border-radius:3px; padding:0;">
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="control-group" style="flex:1; display:flex; flex-direction:column;">
                <h3>3. 레이어</h3>
                <div class="row" style="margin-bottom:8px;">
                    <label style="font-size:12px; width:95px; white-space:nowrap;">애니메이션 속도:</label>
                    <select id="animSpeed" onchange="toggleCustomSpeed(); draw();" style="flex:1; font-size:12px;">
                        <option value="1000">빠르게</option>
                        <option value="2000" selected>기본</option>
                        <option value="3000">느리게</option>
                        <option value="custom">직접 조정</option>
                    </select>
                    <div id="customSpeedWrapper" style="display:none; align-items:center; margin-left:4px;">
                        <input type="number" id="customSpeed" value="2000" onchange="draw(); triggerAutoSave();" style="width:50px; font-size:11px; height:24px; border:1px solid #ccc; border-radius:3px;">
                        <span style="font-size:11px; margin-left:3px; color:#555;">ms</span>
                    </div>
                </div>
                
                <div id="layerList" class="layer-list"></div>

                <div class="row" style="margin-top:8px;">
                    <label style="font-size:12px; width:95px; white-space:nowrap;">추가 효과:</label>
                    <select id="globalEffect" onchange="draw(); triggerAutoSave();" style="flex:1; font-size:12px;">
                        <option value="none" selected>효과 없음</option>
                        <option value="lines">1. 교차 빛나는 선</option>
                        <option value="trace">2. 이미지 테두리 빛 궤적</option>
                        <option value="trace_after">3. 애니메이션 종료 후 이미지 테두리 빛 궤적</option>
                        <option value="flash">4. 애니메이션 종료 후 번쩍</option>
                    </select>
                </div>
            </div>
            
            <div class="control-group">
                <h3>4. 타이포</h3>
                <div class="row">
                    <label style="font-size:12px; width:75px;">파일 업로드:</label>
                    <input type="file" id="fontInput" multiple accept=".ttf,.otf,.woff,.woff2" style="flex:1;">
                </div>
                <div class="row">
                    <label style="font-size:12px; width:75px;">타이핑 속도:</label>
                    <select id="typeSpeed" onchange="toggleCustomTypeSpeed(); draw(); triggerAutoSave();" style="flex:1; font-size:12px;">
                        <option value="50">빠르게</option>
                        <option value="100" selected>기본</option>
                        <option value="200">느리게</option>
                        <option value="custom">직접 조정</option>
                    </select>
                    <div id="customTypeSpeedWrapper" style="display:none; align-items:center; margin-left:4px;">
                        <input type="number" id="customTypeSpeed" value="100" onchange="draw(); triggerAutoSave();" style="width:50px; font-size:11px; height:24px; border:1px solid #ccc; border-radius:3px;">
                        <span style="font-size:11px; margin-left:3px; color:#555;">ms</span>
                    </div>
                </div>
                <div class="row">
                    <label style="font-size:12px; width:75px;">적용 폰트:</label>
                    <select id="globalFont" onchange="draw(); triggerAutoSave();" style="flex:1; font-size:12px;">
                        <option value="Black Han Sans" selected>블랙한산스</option>
                        <option value="Jua">주아체</option>
                        <option value="Nanum Myeongjo">나눔명조</option>
                        <option value="Malgun Gothic">기본고딕</option>
                    </select>
                    <label style="font-size:12px; display:flex; align-items:center; margin-left:5px; white-space:nowrap;">폰트 크기: 
                        <input type="number" id="gFontSize" value="60" onchange="draw(); triggerAutoSave();" style="width:40px; margin-left:4px;">
                        <span style="font-size:11px; margin-left:2px;">pt</span>
                    </label>
                </div>
                
                <div class="row" style="font-size:11px; gap: 6px; flex-wrap: wrap; margin-top: 8px;">
                    <label class="fx-label"><input type="checkbox" id="gVertical" onchange="draw(); triggerAutoSave();">세로 쓰기</label>
                    <label class="fx-label"><input type="checkbox" id="gBold" onchange="draw(); triggerAutoSave();">굵게</label>
                    <label class="fx-label"><input type="checkbox" id="gItalic" checked onchange="draw(); triggerAutoSave();">기울임</label>
                    <label class="fx-label"><input type="checkbox" id="gShadow" checked onchange="draw(); triggerAutoSave();">그림자</label>
                    <label class="fx-label"><input type="checkbox" id="gStroke" checked onchange="draw(); triggerAutoSave();">테두리</label>
                    
                    <div class="color-combo" title="테두리 색상">
                        <input type="color" id="gStrokeColor" value="#000000" oninput="$('gStrokeHex').value=this.value; draw(); triggerAutoSave();">
                        <input type="text" id="gStrokeHex" value="#000000" maxlength="7" oninput="if(this.value.match(/^#[0-9a-fA-F]{6}$/i)) { $('gStrokeColor').value=this.value; draw(); triggerAutoSave(); }">
                    </div>
                    
                    <label class="fx-label" style="margin-left:auto;">굵기:<input type="number" id="gStrokeWidth" value="3" onchange="draw(); triggerAutoSave();" style="width:28px; margin-left:2px; height:22px; border:1px solid #ccc; border-radius:3px;"></label>
                </div>
            </div>

            <div class="control-group">
                <h3>5. 출력 파일 형식</h3>
                <div class="row" style="flex-wrap: nowrap; gap: 8px;">
                    <select id="quality" onchange="toggleBgColor(); triggerAutoSave();" style="width: 225px; font-size: 12px; flex-shrink: 0;">
                        <option value="apng" selected>APNG(코코포리아 최적화)</option>
                        <option value="gif">GIF</option>
                        <option value="mp4">MP4 (원본 화질)</option>
                    </select>
                    
                    <div id="bgOptionWrapper" style="display:none; align-items:center; gap:8px; background:#f5f5f5; border-radius:4px; border:1px solid #E8D8C8; padding:3px 6px; flex:1; min-width:0;">
                        
                        <div id="colorComboWrapper" style="display:flex; align-items:center; transition:0.2s;">
                            <div class="color-combo">
                                <input type="color" id="gifBgColor" value="#ffffff" oninput="$('gifBgHex').value=this.value; $('ccfoliaBgCheck').checked=false; draw(); triggerAutoSave();" title="배경 색상">
                                <input type="text" id="gifBgHex" value="#ffffff" maxlength="7" oninput="if(this.value.match(/^#[0-9a-fA-F]{6}$/i)) { $('gifBgColor').value=this.value; $('ccfoliaBgCheck').checked=false; draw(); triggerAutoSave(); }">
                            </div>
                        </div>
                        
                        <div id="transCheckWrapper" style="display:flex; align-items:center;">
                            <label class="fx-label" style="font-weight:bold; color:#0055FF; margin:0;"><input type="checkbox" id="gifTransparentCheck" onchange="toggleTrans();">투명</label>
                        </div>

                        <label style="font-size:11px; display:flex; align-items:center; cursor:pointer; color:#0055FF; font-weight:bold; margin:0; margin-left:auto;">
                            <input type="checkbox" id="ccfoliaBgCheck" onchange="if(this.checked){ $('gifBgHex').value='#2b2b2b'; $('gifBgColor').value='#2b2b2b'; } else { $('gifBgHex').value='#ffffff'; $('gifBgColor').value='#ffffff'; } draw(); triggerAutoSave();">
                            코코포
                        </label>
                    </div>
                </div>
            </div>
            
            <div>
                <button id="previewBtn" class="action-btn">▶ 애니메이션 미리보기</button>
                <button id="generateBtn" class="action-btn">🎬 파일 다운로드</button>
            </div>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const canvasEl = $('canvas');
        const ctx = canvasEl.getContext('2d', { willReadFrequently: true });
        
        let layers = [], customFonts = [], sel = -1;
        let isDragImg = false, isDragText = false, isRes = false, isPlay = false;
        let offX = 0, offY = 0, textRelX = 0, textRelY = 0;
        let W = 600, H = 800;
        let gifWorkerUrl = null; 
        
        const ease = t => 1 - Math.pow(1 - t, 3);

        window.toggleAdvAlign = (span) => {
            const wrap = $('advAlignWrapper');
            if(wrap.style.display === 'none') { wrap.style.display = 'block'; span.innerText = '상세 조절 접기 ▲'; } 
            else { wrap.style.display = 'none'; span.innerText = '상세 조절 펼치기 ▼'; }
        };

        window.toggleBgColor = () => {
            const v = $('quality').value, wrap = $('bgOptionWrapper'), transOpt = $('transCheckWrapper');
            if (v === 'gif') { wrap.style.display = 'flex'; transOpt.style.display = 'flex'; } 
            else if (v === 'mp4') { wrap.style.display = 'flex'; transOpt.style.display = 'none'; $('gifTransparentCheck').checked = false; toggleTrans(); } 
            else { wrap.style.display = 'none'; }
        };

        window.toggleTrans = () => {
            const isTrans = $('gifTransparentCheck').checked;
            $('gifBgColor').disabled = isTrans; $('gifBgHex').disabled = isTrans; $('ccfoliaBgCheck').disabled = isTrans;
            $('colorComboWrapper').style.opacity = isTrans ? '0.4' : '1'; $('colorComboWrapper').style.pointerEvents = isTrans ? 'none' : 'auto';
            draw(); triggerAutoSave();
        };

        window.toggleCustomSpeed = () => $('customSpeedWrapper').style.display = $('animSpeed').value === 'custom' ? 'flex' : 'none';
        window.toggleCustomTypeSpeed = () => $('customTypeSpeedWrapper').style.display = $('typeSpeed').value === 'custom' ? 'flex' : 'none';

        const getDuration = () => $('animSpeed').value === 'custom' ? (parseInt($('customSpeed').value) || 2000) : parseInt($('animSpeed').value);
        const getTypeSpeedMs = () => $('typeSpeed').value === 'custom' ? (parseInt($('customTypeSpeed').value) || 100) : parseInt($('typeSpeed').value);
        const getFontStr = () => `${$('gItalic').checked ? 'italic ' : ''}${$('gBold').checked ? 'bold ' : ''}${parseInt($('gFontSize').value) || 60}px "${$('globalFont').value}"`;

        const getTextBounds = (text, fSize) => {
            if (!text) return { w: 0, h: 0 };
            ctx.font = getFontStr();
            if ($('gVertical').checked) {
                let w = 0, chars = text.split(''); chars.forEach(c => w = Math.max(w, ctx.measureText(c).width));
                return { w: w + 4, h: chars.length * (fSize * 1.1) + 4 };
            } else return { w: ctx.measureText(text).width + 4, h: fSize + 10 };
        };

        // --- 데이터베이스 & 자동저장 ---
        const localDB = {
            db: null,
            init() { return new Promise((res, rej) => { const req = indexedDB.open('CCfoliaCutinDB', 1); req.onupgradeneeded = e => { if (!e.target.result.objectStoreNames.contains('data')) e.target.result.createObjectStore('data'); }; req.onsuccess = e => { this.db = e.target.result; res(); }; req.onerror = rej; }); },
            set(key, val) { return new Promise((res) => { if (!this.db) return res(); const tx = this.db.transaction('data', 'readwrite'); tx.objectStore('data').put(val, key); tx.oncomplete = res; }); },
            get(key) { return new Promise((res) => { if (!this.db) return res(null); const tx = this.db.transaction('data', 'readonly'); const req = tx.objectStore('data').get(key); req.onsuccess = () => res(req.result); req.onerror = () => res(null); }); }
        };

        let autoSaveTimer;
        window.triggerAutoSave = () => {
            if(isPlay) return; clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(async () => {
                try { await localDB.set('ccfolia_cutin_backup', JSON.stringify(getProjectData())); const st = $('autoSaveStatus'); if (st) { st.innerText = "✓ 방금 전 저장됨"; setTimeout(() => { if (st.innerText === "✓ 방금 전 저장됨") st.innerText = ""; }, 2500); } } catch(e) {}
            }, 1000);
        };

        const getProjectData = () => ({
            layers: layers.map(l => ({ src: l.src, name: l.name, anim: l.anim, scale: l.scale, x: l.x, y: l.y, text: l.text, colors: l.colors, textX: l.textX, textY: l.textY })),

        $('generateBtn').onclick = () => {
            if (!layers.length || isPlay) return alert("이미지를 추가하거나 재생을 멈춰주세요.");
            const mode = $('quality').value, isAPNG = mode === 'apng', isMP4 = mode === 'mp4', isGifTrans = mode === 'gif' && $('gifTransparentCheck').checked, bgColor = $('gifBgHex').value;
            const dur = getDuration(), totalDur = dur + 2000;
            let videoExt = (window.MediaRecorder && MediaRecorder.isTypeSupported('video/mp4')) ? '.mp4' : '.webm', ext = isAPNG ? '.png' : (isMP4 ? videoExt : '.gif');
            let fn = prompt("저장할 파일명:", "FebCryptbound_fighting")?.trim(); if (!fn) return; if (!fn.endsWith(ext)) fn += ext;
            
            const btn = $('generateBtn'), og = btn.innerText; btn.disabled = $('previewBtn').disabled = true; btn.innerText = "⏳ 인코딩 중...";
            const endGenerate = (msg) => { btn.innerText = msg; setTimeout(() => { btn.innerText = og; btn.disabled = $('previewBtn').disabled = false; updateUI(sel); }, 2000); };
            
            let eFrames = Math.min(100, Math.round(totalDur / (isAPNG ? 66 : 50))), eDelay = Math.round(totalDur / eFrames), sc = 1.0;
            // 1MB 방어용 해상도 조절 로직 
            if (isAPNG) { const curP = W * H * eFrames; if (curP > 5000000) sc = Math.min(1.0, Math.sqrt(5000000 / curP)); }
            
            const eW = Math.floor(W * sc), eH = Math.floor(H * sc), oCtx = document.createElement('canvas').getContext('2d', { willReadFrequently: true }); oCtx.canvas.width = eW; oCtx.canvas.height = eH;
            
            exec(t_idx => {
                if (isMP4) {
                    try {
                        let mimeType = videoExt === '.mp4' ? 'video/mp4' : 'video/webm', stream = oCtx.canvas.captureStream(30), recorder = new MediaRecorder(stream, { mimeType }), chunks = [];
                        recorder.ondataavailable = e => chunks.push(e.data);
                        recorder.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: mimeType })); a.download = fn; a.click(); endGenerate("🔥 완료!"); };
                        recorder.start(); let startT = performance.now();
                        const renderLoop = (now) => {
                            let t = Math.min(now - startT, totalDur); oCtx.save(); oCtx.clearRect(0, 0, eW, eH); oCtx.fillStyle = bgColor; oCtx.fillRect(0, 0, eW, eH); oCtx.scale(sc, sc); render(oCtx, t, dur); oCtx.restore();
                            if (t < totalDur) requestAnimationFrame(renderLoop); else setTimeout(() => recorder.stop(), 100);
                        }; requestAnimationFrame(renderLoop);
                    } catch(e) { endGenerate("❌ 브라우저 미지원"); alert("이 브라우저는 비디오 저장을 미지원합니다.\nAPNG나 GIF를 사용해주세요."); }
                } else if (isAPNG) {
                    const frames = [];
                    for (let i = 0; i < eFrames; i++) { oCtx.save(); oCtx.clearRect(0, 0, eW, eH); oCtx.scale(sc, sc); render(oCtx, i * eDelay, dur); oCtx.restore(); frames.push(oCtx.getImageData(0, 0, eW, eH).data.buffer); }
                    setTimeout(() => {
                        try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([UPNG.encode(frames, eW, eH, 256, Array(eFrames).fill(eDelay))], { type: 'image/apng' })); a.download = fn; a.click(); endGenerate("🔥 완료!");
                        } catch (e) { endGenerate("❌ 오류 발생"); alert("APNG 오류:\n" + e.message); }
                    }, 100);
                } else {
                    const processGif = async () => {
                        try {
                            if (!gifWorkerUrl) { const res = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'); if(!res.ok) throw new Error("워커 실패"); gifWorkerUrl = URL.createObjectURL(new Blob([await res.text()], { type: 'application/javascript' })); }
                            const gif = new GIF({ workers: 2, quality: 1, width: eW, height: eH, workerScript: gifWorkerUrl, transparent: isGifTrans ? 0xFF00FF : null, background: !isGifTrans ? bgColor : '#ffffff' });
                            for (let i = 0; i < eFrames; i++) {
                                oCtx.save(); oCtx.clearRect(0, 0, eW, eH); if (!isGifTrans) { oCtx.fillStyle = bgColor; oCtx.fillRect(0, 0, eW, eH); }
                                oCtx.scale(sc, sc); render(oCtx, i * eDelay, dur); oCtx.restore();
                                if (isGifTrans) {
                                    const imgData = oCtx.getImageData(0, 0, eW, eH), data = imgData.data;
                                    for (let j = 0; j < data.length; j += 4) { if (data[j+3] < 128) { data[j] = 255; data[j+1] = 0; data[j+2] = 255; data[j+3] = 255; } else { if (data[j] === 255 && data[j+1] === 0 && data[j+2] === 255) data[j] = 254; data[j+3] = 255; } }
                                    oCtx.putImageData(imgData, 0, 0);
                                }
                                gif.addFrame(oCtx.canvas, {copy: true, delay: eDelay});
                            }
                            gif.on('finished', function(blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fn; a.click(); endGenerate("🔥 완료!"); }); gif.render();
                        } catch (e) { endGenerate("❌ 오류 발생"); alert("GIF 오류:\n" + e.message); }
                    }; processGif();
                }
            });
        };
    </script>
